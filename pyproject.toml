[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
# Core ML dependencies
faiss-cpu = "1.11.0.post1"
torch = { version = "2.7.1+cu126", source = "pytorch" }
torchvision = { version = "0.22.1+cu126", source = "pytorch" }
numpy = "2.3.1"
# Image processing
pillow = "11.3.0"
pillow-heif = "1.0.0"
imagehash = "4.3.2"
# Web app
streamlit = "1.47.0"
streamlit-image-comparison = "0.0.4"
# Desktop GUI
pyside6 = "6.8.1"
# Memory profiling
psutil = "^6.1.0"
memory-profiler = "^0.61.0"
# Utilities
requests = "2.32.4"

[tool.poetry.group.dev.dependencies]
# Development tools
poethepoet = "^0.36.0"
ruff = "^0.12.4"
# Testing
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
pytest-asyncio = "^1.1.0"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks]
streamlit = "streamlit run app.py"
gui = "python gui_app.py"

[tool.poe.tasks.lint]
cmd = "ruff check --fix ."

[tool.poe.tasks.format]
cmd = "ruff format ."

[tool.poe.tasks.check]
cmd = "ruff check . && ruff format --diff ."

[tool.poe.tasks.test]
cmd = "pytest -v"

[tool.poe.tasks.test-cov]
cmd = "pytest --cov=. --cov-report=html --cov-report=term-missing -v"

[tool.poe.tasks.test-watch]
cmd = "pytest -f -v"

[tool.ruff]
line-length = 140
target-version = "py312"
fix = true
lint.select = [
    "E",
    "F",
    "B",
    "I",
] # E=pycodestyle, F=pyflakes, B=bugbear, I=import sort
exclude = ["__pycache__", ".venv", "dist"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as async tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["."]
omit = [
    "test_*.py",
    "*_test.py",
    "venv/*",
    ".venv/*",
    "*/site-packages/*",
    "__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
